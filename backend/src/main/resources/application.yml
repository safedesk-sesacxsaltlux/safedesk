server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/safedesk
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: ${JWT_SECRET}
  expiration-seconds: 3600
  refresh-expiration-seconds: 604800 # 7일
  # 배포시에는 true로 변경, 로컬환경에서는 false
  refresh-cookie-secure: false

ai:
  timeout-ms: 10000
  mock:
    mode: NORMAL

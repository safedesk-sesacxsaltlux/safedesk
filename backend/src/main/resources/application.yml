server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/safedesk
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: ${JWT_SECRET}

ai:
  timeout-ms: 10000
  mock:
    mode: NORMAL
